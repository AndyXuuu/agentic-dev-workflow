version: 1
module: .repo-nav
purpose: AI-first search navigation layer for repository tasks

usage:
  priority: first-stop
  instruction: >-
    Read this index before broad repository search. Its purpose is to help AI
    search tasks become faster, more accurate, and more stable. Use it to narrow
    the search space, then fall back to grep, glob, read, and LSP when needed.

entrypoints:
  readme: .repo-nav/README.md
  docs: .repo-nav/docs.yaml
  modules: .repo-nav/modules.yaml
  workflows: .repo-nav/workflows.yaml
  auto: .repo-nav/auto/README.md

policy:
  role: ai-search-navigation-not-replacement
  fallback: code-and-doc search wins when the index is stale or incomplete

areas:
  - name: setup
    file: .repo-nav/opencode-omo-openai-setup.md
    description: End-to-end environment setup and reproduction guide
  - name: doc-mapping-index
    file: .repo-nav/docs.yaml
    description: AI-facing mapping of repository knowledge entries and their relationships
  - name: module-index
    file: .repo-nav/modules.yaml
    description: High-level ownership and entrypoint map for repository modules
  - name: workflow-index
    file: .repo-nav/workflows.yaml
    description: Common workflows, starting points, and verification routes
  - name: auto-index
    file: .repo-nav/auto/README.md
    description: Incrementally generated knowledge artifacts
