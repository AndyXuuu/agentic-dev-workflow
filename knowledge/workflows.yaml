version: 1
workflows:
  - id: bootstrap-machine
    goal: Reproduce the OpenCode + oMo environment on a new machine
    start_with:
      - knowledge/opencode-omo-openai-setup.md
    inspect:
      - config/opencode.json
      - config/oh-my-openagent.json
      - config/agents/frontend-builder.md
      - config/agents/frontend-review.md
      - config/agents/frontend-polish.md
    verify:
      - OpenCode loads plugin pinning
      - Marksman is available in PATH
      - YAML LSP is enabled
      - Playwright MCP is enabled

  - id: configure-frontend-workflow
    goal: Understand or adjust the frontend replacement chain
    start_with:
      - knowledge/index.yaml
      - knowledge/modules.yaml
    inspect:
      - config/agents/frontend-builder.md
      - config/agents/frontend-review.md
      - config/agents/frontend-polish.md
      - config/opencode.json
    verify:
      - frontend-* task permissions exist
      - browser verification path exists

  - id: inspect-model-routing
    goal: Understand or modify current OpenAI model routing
    start_with:
      - knowledge/index.yaml
      - knowledge/modules.yaml
    inspect:
      - config/oh-my-openagent.json
    verify:
      - agent routes match intended cost/stability split
      - category routes match intended task profile

  - id: task-handoff-guard-implementation
    goal: Understand or continue the Task Handoff Guard design and MVP implementation
    start_with:
      - knowledge/index.yaml
      - knowledge/modules.yaml
      - task-handoff-guard/README.md
    inspect:
      - task-handoff-guard/PLAN.md
      - task-handoff-guard/FLOW.md
      - task-handoff-guard/STATE_MACHINE.md
      - task-handoff-guard/PSEUDOCODE.md
      - task-handoff-guard/IMPLEMENTATION_NOTES.md
      - task-handoff-guard/mvp/
      - task-handoff-guard/demo/
    verify:
      - handoff preflight flow remains aligned with design
      - resume guard behavior remains aligned with state machine
