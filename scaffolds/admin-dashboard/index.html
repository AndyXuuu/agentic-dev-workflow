<!doctype html>
<html lang="zh-CN" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="可独立使用的 React 后台管理脚手架" />
    <script>
      try {
        const savedTheme = localStorage.getItem('admin-dashboard-theme')
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = savedTheme || (systemDark ? 'business' : 'corporate')
      } catch {
        document.documentElement.dataset.theme = 'corporate'
      }
    </script>
    <title>Admin Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
